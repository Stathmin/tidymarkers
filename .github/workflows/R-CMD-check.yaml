# Template CI for the kaspexample package.
# NOTE: GitHub Actions only runs workflows from the *repository root* .github/.
# If the package lives in a subdirectory of a monorepo, move/copy this file to
# the repo root and set `working-directory` to the package path.
name: R-CMD-check

on:
  push:
  pull_request:

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      # OligoArrayAux provides `hybrid-min`, which DECIPHER needs for dG/Tm.
      - name: Install OligoArrayAux
        run: |
          conda install -y -c bioconda -c conda-forge oligoarrayaux
          echo "$CONDA/bin" >> "$GITHUB_PATH"

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"warning"'
