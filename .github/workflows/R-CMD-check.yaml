# GitHub Actions CI for tidymarkers.
#
# Runs on every push and pull request: R CMD check --as-cran across the
# platforms CRAN builds on. `release` is checked on Linux, macOS and Windows;
# `oldrel-1` only on Linux, where it catches R-version breakage without
# tripling the wall clock.
#
# `devel` is a *nightly* job, not a per-push one. P3M serves binaries for
# released R only, so the devel leg source-compiles its whole dependency tree;
# per push it was still installing when the next push cancelled the run, and
# `actions/cache` saves only on a successful job end -- so it recompiled from
# scratch every time and never produced a verdict. At 03:23 UTC it runs alone,
# finishes, and warms its own cache. R-devel breaks between R releases, not
# between your commits. See ROADMAP D8.
#
# The devel *installation* is its own job (`devel-cache`), and the check job
# `needs:` it. A ~58 min source install followed by a ~16 min check is one job
# that spends ~75 min inside a single runner, which is where the shutdown
# signal has landed three times (ROADMAP 36); and because `actions/cache` saves
# only when a job ends successfully, a job that dies after installing caches
# nothing -- so the next run installs for another 58 min and dies again. Split,
# each job stays short: the install job ends green and saves the cache, the
# check job restores it warm (ROADMAP 24 measures that warm step), and a
# failure in the check no longer throws the installation away.
#
# OligoArrayAux (`hybrid-min`/`hybrid-ss-min`) and BLAST+ are *optional*
# engines: the suite skips an assertion when an engine is absent. Which leg gets
# what is the `engines` matrix key: `unix` (both Linux legs) unpacks a pinned
# bioconda tarball for OligoArrayAux (the runner images no longer ship conda) and
# apt-installs BLAST+; `mac` brew-installs BLAST+ only; `win` has no BLAST+, but
# compiles OligoArrayAux from the pinned sources with the gcc Rtools ships. The
# genome, variation and indexes are never needed -- every network example is
# wrapped in \dontrun{} and tests use fixtures.
name: R-CMD-check

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    schedule:
        # nightly: the devel leg and a fresh full matrix, uncancelled
        - cron: "23 3 * * *"
    workflow_dispatch:

# One run per branch: a push supersedes the previous push's run. The scheduled
# and dispatched runs get their own group, so a push can never cancel the
# nightly leg (and throw away the cache it just warmed).
concurrency:
    group: ${{ github.workflow }}-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'nightly' || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
    # The step list is identical for both jobs, so it is written once and
    # aliased (`*steps`, `*job-env`). Job-level `if:` is evaluated *before* the
    # matrix expands, so a `matrix.config.r != 'devel'` gate on one job is not
    # expressible -- the split into two jobs is the honest form of it.
    R-CMD-check:
        name: ${{ matrix.config.os }} (${{ matrix.config.r }})
        runs-on: ${{ matrix.config.os }}
        # Bounds a hang to the job rather than the runner.
        timeout-minutes: 120
        env: &job-env
            GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
            R_KEEP_PKG_SOURCE: yes
            _R_CHECK_FORCE_SUGGESTS_: false
            # testthat reads the worker count from this, not from DESCRIPTION.
            # Per-leg, not shared: the devel job runs half the workers (see the
            # devel matrix) because R-devel + Bioc-devel are source-compiled, so
            # its runner has less headroom than a release leg's.
            TESTTHAT_CPUS: ${{ matrix.config.cpus }}
        strategy:
            fail-fast: false
            matrix:
                config:
                    - {
                          os: ubuntu-latest,
                          r: "release",
                          engines: unix,
                          cpus: 4,
                      }
                    - {
                          os: ubuntu-latest,
                          r: "oldrel-1",
                          engines: unix,
                          cpus: 4,
                      }
                    - { os: macos-latest, r: "release", engines: mac, cpus: 4 }
                    - {
                          os: windows-latest,
                          r: "release",
                          engines: win,
                          cpus: 4,
                      }
        steps: &steps
            - uses: actions/checkout@v4

            - uses: r-lib/actions/setup-r@v2
              with:
                  r-version: ${{ matrix.config.r }}
                  use-public-rspm: true

            - uses: r-lib/actions/setup-r-dependencies@v2
              timeout-minutes: 75
              with:
                  extra-packages: any::rcmdcheck, any::pkgload
                  needs: check

            # ROADMAP ZY18, the Commons licensing invariant: MIT, no weaponized
            # licence additions. dev/check-licenses.R scans the dependencies
            # DESCRIPTION declares (never the whole library) and fails on AGPL,
            # NonCommercial, Commons Clause, SSPL, Elastic or BUSL -- including
            # the dual-licence form `AGPL-3 | MIT`. No `if:` guard and no
            # continue-on-error: it reads what setup-r-dependencies just
            # installed, so every leg runs it, and a forbidden licence must red
            # the job.
            - name: Licence gate (Commons licensing invariant)
              run: Rscript dev/check-licenses.R

            # OligoArrayAux provides `hybrid-min`, which DECIPHER needs for dG/Tm.
            # `ubuntu-latest` no longer ships conda, and the bioconda package is
            # just `bin/` + `share/oligoarrayaux/` -- the layout
            # `oligoarrayaux_paths()` already discovers -- so unpack the pinned
            # tarball instead of running a solver. The binary links only libm/libc.
            - name: Install OligoArrayAux (Linux)
              if: matrix.config.engines == 'unix'
              run: |
                  curl -sSL -o "$RUNNER_TEMP/oaa.tar.bz2" \
                    https://conda.anaconda.org/bioconda/linux-64/oligoarrayaux-3.8.1-pl5321h9948957_0.tar.bz2
                  echo "d8b8dc76f6d0f02825e3f477008a632db36bfe46434fc3619bd637d4afb131f5  $RUNNER_TEMP/oaa.tar.bz2" | sha256sum -c -
                  mkdir -p "$RUNNER_TEMP/oaa"
                  tar -xjf "$RUNNER_TEMP/oaa.tar.bz2" -C "$RUNNER_TEMP/oaa"
                  echo "$RUNNER_TEMP/oaa/bin" >> "$GITHUB_PATH"

            # BLAST+ is the fourth measurement engine in the provenance stamp. The
            # suite skips the stamp assertion when an engine is absent, so this step
            # is what keeps that assertion exercised here.
            - name: Install BLAST+ (Linux)
              if: matrix.config.engines == 'unix'
              run: sudo apt-get update && sudo apt-get install -y ncbi-blast+

            - name: Install BLAST+ (macOS)
              if: matrix.config.engines == 'mac'
              run: brew install blast

            # Windows builds OligoArrayAux from the pinned sources with the gcc
            # Rtools ships: there is no make on the runner, so the script compiles
            # the five C units directly. Locating gcc goes through pkgbuild, which
            # is what setup-r-dependencies already installed and what knits
            # Rtools' PATH in.
            - name: Install OligoArrayAux (Windows)
              if: matrix.config.engines == 'win'
              shell: bash
              run: |
                  export PATH="$(dirname "$(Rscript -e 'cat(pkgbuild::with_build_tools(Sys.which("gcc")))')"):$PATH"
                  Rscript data-raw/install-oligoarrayaux.R
                  cygpath -w "$GITHUB_WORKSPACE/.tools/bin" >> "$GITHUB_PATH"
                  UNAFOLDDAT="$(cygpath -w "$GITHUB_WORKSPACE/.tools/share/oligoarrayaux")" \
                    "$GITHUB_WORKSPACE/.tools/bin/hybrid-min.exe" -n DNA -t 37 -T 37 \
                    -N 0.05 -E -q ACGTACGTACGTACGTACGT ACGTACGTACGTACGTACGT

            # Warm the Atlas/TAIR10 demo cache before R CMD check so the
            # arms/primer3/plan tests run instead of skipping on a cold cache.
            # Best-effort: the skip helper exists so a network failure inside
            # the suite never fails the job, so this step must keep that
            # invariant -- on failure it degrades to those tests SKIP (visible
            # in the test output and this step's warning), not to a red job.
            - name: Warm demo cache (best-effort)
              continue-on-error: true
              # The R code lives in dev/warm-demo-cache.R.  The multi-line
              # `Rscript -e` this step used to carry died before R started on
              # Windows -- exit 139 in ~60 ms, no output at all -- under both
              # pwsh and bash, so the runner never warmed anything and the
              # suite fell back to SKIPs.  A one-line command under the default
              # shell has no quoting hazard on either platform.
              run: Rscript dev/warm-demo-cache.R

            - uses: r-lib/actions/check-r-package@v2
              # A cold demo cache makes the examples ~11 min and the suite ~21 min
              # on Windows, so the 40-minute step ceiling cut the vignette
              # rebuild off mid-run; 50 leaves headroom for both.
              timeout-minutes: 50
              with:
                  args: 'c("--no-manual", "--as-cran")'
                  error-on: '"warning"'
                  upload-snapshots: true

            # The devel leg once died inside `* checking tests ...` with exit
            # 143 about 75 minutes after job start. Measured later: the suite
            # really runs ~21-30 minutes and the job finished in ~20 minutes, so
            # the sender was the runner shutting the job down mid-test-run; no
            # OOM-killer message or elapsed-time limit was found and memory
            # pressure is *not* established. `TESTTHAT_CPUS=2` stays as a
            # mitigation. Whatever kills it kills the process group before R
            # writes the failing test's output, and `check-r-package`'s own
            # upload step is skipped when the check fails, so capture the check
            # directory ungated by success.
            #
            # `cancelled()` is in the condition because a job recorded as
            # cancelled (which is how a runner shutdown / cancellation lands in
            # the run's status) evaluates `failure()` to false and skips every
            # step gated on it -- measured on the nightly run that lost its
            # runner: both evidence steps reported `skipped`. A reclaimed VM
            # may still take the artifact with it; this is best-effort.
            - name: Upload check results on failure
              if: failure() || cancelled()
              uses: actions/upload-artifact@v4
              with:
                  name: check-failure-${{ matrix.config.os }}-${{ matrix.config.r }}
                  path: |
                      check/**
                      **/*.Rout*
                  if-no-files-found: ignore
                  retention-days: 7

            # Same evidence question, other side: was the runner under memory or
            # disk pressure when it sent the signal? Best-effort, Linux only.
            - name: Runner pressure on failure (best-effort)
              if: (failure() || cancelled()) && runner.os == 'Linux'
              continue-on-error: true
              run: |
                  free -m
                  df -h "$RUNNER_TEMP"
                  sudo dmesg --ctime | tail -30

    # Installs the devel dependency tree and nothing else, so the job ends
    # green and `actions/cache` (inside `setup-r-dependencies`) saves it. The
    # three steps below repeat the head of `*steps`; YAML cannot splice a
    # sequence, and a shared anchor would have to be a job key. No `env:` here:
    # `*job-env` carries `matrix.config.cpus`, and this job has no matrix.
    devel-cache:
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        name: ubuntu-latest (devel, dependencies)
        runs-on: ubuntu-latest
        timeout-minutes: 120
        steps:
            - uses: actions/checkout@v4

            - uses: r-lib/actions/setup-r@v2
              with:
                  r-version: devel
                  use-public-rspm: true

            - uses: r-lib/actions/setup-r-dependencies@v2
              timeout-minutes: 75
              with:
                  extra-packages: any::rcmdcheck, any::pkgload
                  needs: check

    R-CMD-check-devel:
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        needs: devel-cache
        name: ubuntu-latest (devel)
        runs-on: ubuntu-latest
        timeout-minutes: 120
        env: *job-env
        strategy:
            fail-fast: false
            matrix:
                config:
                    - { os: ubuntu-latest, r: "devel", engines: unix, cpus: 2 }
        steps: *steps
