# GitHub Actions CI for tidymarkers.
#
# Runs on every push and pull request: R CMD check --as-cran on the package,
# with OligoArrayAux available because DECIPHER needs `hybrid-min`/`hybrid-ss-min`
# for its dG/Tm estimates. The genome, variation and indexes are *not* needed --
# every network example is wrapped in \dontrun{} and tests use fixtures.
name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_FORCE_SUGGESTS_: false
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      # OligoArrayAux provides `hybrid-min`, which DECIPHER needs for dG/Tm.
      - name: Install OligoArrayAux
        run: |
          conda install -y -c bioconda -c conda-forge oligoarrayaux
          echo "$CONDA/bin" >> "$GITHUB_PATH"

      # BLAST+ is the fourth measurement engine in the provenance stamp. The
      # suite skips the stamp assertion when an engine is absent, so this step
      # is what keeps that assertion exercised here.
      - name: Install BLAST+
        run: sudo apt-get update && sudo apt-get install -y ncbi-blast+

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"warning"'
