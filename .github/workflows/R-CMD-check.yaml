# GitHub Actions CI for tidymarkers.
#
# Runs on every push and pull request: R CMD check --as-cran across the
# platforms CRAN builds on. `release` is checked on Linux, macOS and Windows;
# `oldrel-1` only on Linux, where it catches R-version breakage without
# tripling the wall clock.
#
# `devel` is a *nightly* job, not a per-push one. P3M serves binaries for
# released R only, so the devel leg source-compiles its whole dependency tree;
# per push it was still installing when the next push cancelled the run, and
# `actions/cache` saves only on a successful job end -- so it recompiled from
# scratch every time and never produced a verdict. At 03:23 UTC it runs alone,
# finishes, and warms its own cache. R-devel breaks between R releases, not
# between your commits. See ROADMAP D8.
#
# OligoArrayAux (`hybrid-min`/`hybrid-ss-min`) and BLAST+ are *optional*
# engines: the suite skips an assertion when an engine is absent. The Linux legs
# unpack a pinned bioconda tarball for OligoArrayAux (the runner images no longer
# ship conda) and apt-install BLAST+; macOS brew-installs BLAST+ only; Windows
# installs neither. The genome, variation and indexes are never needed -- every
# network example is wrapped in \dontrun{} and tests use fixtures.
name: R-CMD-check

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    schedule:
        # nightly: the devel leg and a fresh full matrix, uncancelled
        - cron: "23 3 * * *"
    workflow_dispatch:

# One run per branch: a push supersedes the previous push's run. The scheduled
# and dispatched runs get their own group, so a push can never cancel the
# nightly leg (and throw away the cache it just warmed).
concurrency:
    group: ${{ github.workflow }}-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'nightly' || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
    # The step list is identical for both jobs, so it is written once and
    # aliased (`*steps`, `*job-env`). Job-level `if:` is evaluated *before* the
    # matrix expands, so a `matrix.config.r != 'devel'` gate on one job is not
    # expressible -- the split into two jobs is the honest form of it.
    R-CMD-check:
        name: ${{ matrix.config.os }} (${{ matrix.config.r }})
        runs-on: ${{ matrix.config.os }}
        # Bounds a hang to the job rather than the runner.
        timeout-minutes: 120
        env: &job-env
            GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
            R_KEEP_PKG_SOURCE: yes
            _R_CHECK_FORCE_SUGGESTS_: false
            # testthat reads the worker count from this, not from DESCRIPTION
            TESTTHAT_CPUS: 4
        strategy:
            fail-fast: false
            matrix:
                config:
                    - { os: ubuntu-latest, r: "release", engines: unix }
                    - { os: ubuntu-latest, r: "oldrel-1", engines: unix }
                    - { os: macos-latest, r: "release", engines: mac }
                    - { os: windows-latest, r: "release", engines: none }
        steps: &steps
            - uses: actions/checkout@v4

            - uses: r-lib/actions/setup-r@v2
              with:
                  r-version: ${{ matrix.config.r }}
                  use-public-rspm: true

            - uses: r-lib/actions/setup-r-dependencies@v2
              timeout-minutes: 75
              with:
                  extra-packages: any::rcmdcheck, any::pkgload
                  needs: check

            # OligoArrayAux provides `hybrid-min`, which DECIPHER needs for dG/Tm.
            # `ubuntu-latest` no longer ships conda, and the bioconda package is
            # just `bin/` + `share/oligoarrayaux/` -- the layout
            # `oligoarrayaux_paths()` already discovers -- so unpack the pinned
            # tarball instead of running a solver. The binary links only libm/libc.
            - name: Install OligoArrayAux (Linux)
              if: matrix.config.engines == 'unix'
              run: |
                  curl -sSL -o "$RUNNER_TEMP/oaa.tar.bz2" \
                    https://conda.anaconda.org/bioconda/linux-64/oligoarrayaux-3.8.1-pl5321h9948957_0.tar.bz2
                  echo "d8b8dc76f6d0f02825e3f477008a632db36bfe46434fc3619bd637d4afb131f5  $RUNNER_TEMP/oaa.tar.bz2" | sha256sum -c -
                  mkdir -p "$RUNNER_TEMP/oaa"
                  tar -xjf "$RUNNER_TEMP/oaa.tar.bz2" -C "$RUNNER_TEMP/oaa"
                  echo "$RUNNER_TEMP/oaa/bin" >> "$GITHUB_PATH"

            # BLAST+ is the fourth measurement engine in the provenance stamp. The
            # suite skips the stamp assertion when an engine is absent, so this step
            # is what keeps that assertion exercised here.
            - name: Install BLAST+ (Linux)
              if: matrix.config.engines == 'unix'
              run: sudo apt-get update && sudo apt-get install -y ncbi-blast+

            - name: Install BLAST+ (macOS)
              if: matrix.config.engines == 'mac'
              run: brew install blast

            # Warm the Atlas/TAIR10 demo cache before R CMD check so the
            # arms/primer3/plan tests run instead of skipping on a cold cache.
            # Best-effort: the skip helper exists so a network failure inside
            # the suite never fails the job, so this step must keep that
            # invariant -- on failure it degrades to those tests SKIP (visible
            # in the test output and this step's warning), not to a red job.
            - name: Warm demo cache (best-effort)
              continue-on-error: true
              run: |
                  Rscript -e 'pkgload::load_all("."); invisible(ath_genome()); invisible(ensembl_variants("4", 1500000L, 1560000L)); invisible(ensembl_gene("AT4G00650"))'

            - uses: r-lib/actions/check-r-package@v2
              timeout-minutes: 40
              with:
                  args: 'c("--no-manual", "--as-cran")'
                  error-on: '"warning"'
                  upload-snapshots: true

    R-CMD-check-devel:
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        name: ubuntu-latest (devel)
        runs-on: ubuntu-latest
        timeout-minutes: 120
        env: *job-env
        strategy:
            fail-fast: false
            matrix:
                config:
                    - { os: ubuntu-latest, r: "devel", engines: unix }
        steps: *steps
